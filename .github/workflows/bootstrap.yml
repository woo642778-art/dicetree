name: Bootstrap V1 source

on:
  push:
    branches: [feat/v1-tree-planner]
    paths:
      - bootstrap.py
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v1-tree-planner
      - name: Materialize source tree
        run: python bootstrap.py
      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: implement v1 tree planner"
          git push origin HEAD:feat/v1-tree-planner
